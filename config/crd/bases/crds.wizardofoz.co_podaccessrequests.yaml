---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: podaccessrequests.crds.wizardofoz.co
spec:
  group: crds.wizardofoz.co
  names:
    kind: PodAccessRequest
    listKind: PodAccessRequestList
    plural: podaccessrequests
    singular: podaccessrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Access Template
      jsonPath: .spec.templateName
      name: Template
      type: string
    - description: Target Pod Name
      jsonPath: .status.podName
      name: Pod
      type: string
    - description: Is request ready?
      jsonPath: .status.ready
      name: Ready
      type: boolean
    - description: Overridden container image
      jsonPath: .spec.image
      name: Image
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PodAccessRequest is the Schema for the accessrequests API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodAccessRequestSpec defines the desired state of AccessRequest
            properties:
              duration:
                description: |-
                  Duration sets the length of time from the `spec.creationTimestamp` that this object will live. After the
                  time has expired, the resouce will be automatically deleted on the next reconcilliation loop.

                  If omitted, the spec.defautlDuration from the ExecAccessTemplate is used.

                  Valid time units are "s", "m", "h".
                pattern: ^[0-9]+(s|m|h)$
                type: string
              image:
                description: |-
                  Image optionally overrides the container image used for the "default"
                  container of the Pod that Oz launches. This lets a developer run a
                  purpose-built debugging, shell or migration image without an
                  administrator having to author a dedicated `PodAccessTemplate` for it.

                  The image must match one of the patterns that the Oz controller was
                  deployed with (`--allowed-image-patterns`, set through the
                  `controllerManager.manager.allowedImagePatterns` Helm value). If the
                  controller has no patterns configured then image overrides are disabled
                  entirely and this field is rejected.

                  The rest of the PodSpec - volumes, environment, service account - is
                  still inherited from the template's target controller, so the overriding
                  image runs with the same identity and secrets as the workload it is
                  standing in for. Note also that `imagePullSecrets` are inherited, so an
                  image from a registry the workload cannot pull from will fail to start.

                  This field is immutable; request a new `PodAccessRequest` to change it.
                maxLength: 512
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9._:/@+-]*$
                type: string
              templateName:
                description: |-
                  Defines the name of the `ExecAcessTemplate` that should be used to grant access to the target
                  resource.
                type: string
            required:
            - templateName
            type: object
          status:
            description: PodAccessRequestStatus defines the observed state of AccessRequest
            properties:
              accessMessage:
                description: |-
                  AccessMessage is used to describe to the user how they can make use of their temporary access
                  request. Eg, for a PodAccessTemplate the value set here would be something like:

                    "Access Granted, connect to your pod with: kubectl exec -ti -n namespace pod-xyz -- /bin/bash"
                type: string
              conditions:
                description: Current status of the Access Template
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              podName:
                description: The Target Pod Name where access has been granted
                type: string
              ready:
                description: Simple boolean to let us know if the resource is ready
                  for use or not
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
